<div
  class="mdc-image-list__image-aspect-container"
  matBadge="✓"
  matBadgePosition="before"
  [matBadgeHidden]="!selected()"
  [ngClass]="{'selected' : selected()}"
  [style.--selection-color]="selectionColor()"
>
  <div
    class="mdc-image-list__image image-list-image"
    [ngStyle]="{'background-image':'url('+ file().thumbnail_url +')', 'background-color' : file().blurhash ? (file().blurhash | blurhashcolor) : '#c7c5cb'}"
    [ngClass]="'file-id-' + file().file_id"
  >
  </div>
  @if(selectionMemberships().length > 0) {
    <div class="selection-memberships" aria-label="Selection group memberships">
      @for(group of selectionMemberships(); track group.id) {
        <span
          class="selection-membership"
          [style.--membership-color]="group.color"
          [attr.title]="'Selected in ' + group.name"
          [attr.aria-label]="'Selected in ' + group.name"
        >
          <span class="selection-membership__swatch"></span>
          <span class="selection-membership__name">{{group.name}}</span>
        </span>
      }
    </div>
  }
</div>

@if(file().gallery_local){<span class="gallery-source" [attr.title]="file().gallery_name">ComfyUI</span>}
