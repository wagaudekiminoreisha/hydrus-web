<p class="touch-selection-hint">Hold a thumbnail to select it, then tap more. Swipe to scroll.</p>
<virtual-scroller class="virtual-scroll" [class.selection-mode]="selectionActive()" #scroll [items]="files()" (vsEnd)="vsEnd($event)"
  [parentScroll]="scrollElement" [bufferAmount]="24">
  <ul class="mdc-image-list browse-image-list" #container>
    @for (file of scroll.viewPortItems; track file.file_id) {
      <li class="mdc-image-list__item grid-item">
        <a
          class="image-list-link"
          [href]="file.file_url"
          [attr.aria-label]="file.gallery_name || file.hash"
          [draggable]="false"
          (pointerdown)="selectionPointerDown($event, file)"
          (pointerup)="finishTouch($event)" (pointercancel)="finishTouch($event)" (pointermove)="cancelMovedTouch($event)"
          (pointerenter)="selectionPointerEnter($event, file)"
          (click)="fileClick($event, file)"
          (dblclick)="fileDoubleClick($event, file)"
          [appMatContextMenuTriggerFor]="fileMenu"
          [matMenuTriggerData]="{file}"
        >
          <app-image-list-item
            [file]="file"
            [selected]="selected().has(file.file_id)"
            [selectionColor]="activeSelectionColor()"
            [selectionMemberships]="fileGroupMemberships(file.file_id)"
          ></app-image-list-item>
        </a>
      </li>
    }
  </ul>
</virtual-scroller>


<mat-menu #fileMenu="matMenu">
  <ng-template matMenuContent let-file="file">
    @if(selected().has(file.file_id)) {
      <button mat-menu-item (click)="deselect(file)">
        <mat-icon>deselect</mat-icon>
        <span>Deselect</span>
      </button>
    } @else {
      <button mat-menu-item (click)="select(file)">
        <mat-icon>select_all</mat-icon>
        <span>Select</span>
      </button>
    }
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="viewFile(file)">
      <mat-icon>preview</mat-icon>
      <span>View File</span>
    </button>
    <button mat-menu-item (click)="fileInfo(file)">
      <mat-icon>info_outlined</mat-icon>
      <span>File Info</span>
    </button>
    <button mat-menu-item [disabled]="file.gallery_local" (click)="fileInfo(file, true)">
      <mat-icon>sell</mat-icon>
      <span>Manage Tags</span>
    </button>
    @for(action of galleryActions(); track action.label){<button mat-menu-item (click)="action.run(file)"><mat-icon>{{action.icon}}</mat-icon><span>{{action.label}}</span></button>}
    <mat-divider></mat-divider>
    <app-file-context-menu-actions [file]="file"></app-file-context-menu-actions>
  </ng-template>
</mat-menu>
